name: Repository checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  portable-kit:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Synthetic installed-input injection
        run: python -m unittest discover -s tests -p test_agepad_kit_portable.py -v
      - name: Input mismatch and preservation checks
        run: python -m unittest discover -s tests -p test_agepad_kit_diagnostics.py -v

  safety-and-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Repository safety
        run: python3 scripts/check-repo-safety.py
      - name: Repository tests
        run: python3 -m unittest tests/test_repo_safety.py tests/test_intake.py tests/test_gates.py
      - name: PadMint manifest
        run: python3 -c "import json; m=json.load(open('padmint.json')); v=json.load(open('version.json')); assert m['id']=='agepad' and v['version']"
      - name: Game-side tests (no game data; touch tests compile only)
        run: scripts/run-de-tests.sh
